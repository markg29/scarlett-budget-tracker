<!DOCTYPE html>
<html lang="tl">
<head>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2e6;--card:#fffdf8;--ink:#2b2118;--mute:#7a6c5d;--line:#e8e0d0;--soft:#f6f0e3;--fur:#a9774a;--fur-d:#6e4a2a;--pri:#2f7d4f;--pri-d:#1f5c38;--sun:#f59e0b;--ok:#2f7d4f;--okbg:#dcebd3;--warn:#a85f08;--warnbg:#fbe7bd;--bad:#b4381f;--badbg:#f7d9d0;
--disp:'Fredoka','Nunito',ui-rounded,system-ui,sans-serif;--body:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);font-weight:500;padding-bottom:104px}
button,input,select,textarea{font-family:inherit}
header{background:rgba(238,242,230,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;border-bottom:1px solid rgba(110,74,42,.1)}
header b{font:600 22px var(--disp);display:flex;align-items:center;gap:9px;color:var(--fur-d)}header small{display:block;color:var(--mute);font-size:12px;font-weight:600;margin-top:1px}
#logo svg{width:40px;height:40px;display:block;background:var(--okbg);border-radius:50%;padding:3px}
main{padding:14px 14px 4px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px;border:1px solid var(--line);box-shadow:0 8px 22px -14px rgba(110,74,42,.35)}
.card h3{margin:0 0 10px;font:600 17px var(--disp);color:var(--fur-d)}
.big{font:600 38px/1.1 var(--disp);letter-spacing:-.01em}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.mute{color:var(--mute)}.sm{font-size:12.5px}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.banner{border-radius:18px;padding:12px 14px;margin-bottom:14px;font-weight:700}
.banner.ok{background:var(--okbg);color:var(--ok)}.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.bad{background:var(--badbg);color:var(--bad)}
label{display:block;font-size:13px;font-weight:700;color:var(--fur-d);margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:14px;font-size:16px;font-weight:600;background:#fff;color:var(--ink);outline:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(47,125,79,.15)}
button{font:700 15px var(--body);border:0;border-radius:14px;padding:12px 16px;background:var(--pri);color:#fff;cursor:pointer;transition:transform .1s,background .15s}
button:active{transform:scale(.97)}button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button.ghost{background:var(--soft);color:var(--fur-d);box-shadow:inset 0 0 0 1.5px var(--line)}button.danger{background:var(--badbg);color:var(--bad)}button.sm{padding:7px 12px;font-size:13px;border-radius:12px}
button:disabled{opacity:.5}
.full{width:100%;margin-top:16px;padding:14px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:12px;right:12px;max-width:536px;margin:0 auto;background:rgba(255,253,248,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:26px;display:flex;gap:4px;padding:6px;z-index:6;box-shadow:0 12px 30px -10px rgba(75,50,25,.35)}
nav button{flex:1;background:none;color:var(--mute);border-radius:20px;padding:7px 0 6px;font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:var(--pri);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chip{padding:6px 13px;border-radius:99px;background:var(--soft);color:var(--ink);font-size:13px;white-space:nowrap}
.chip.on{background:var(--pri);color:#fff}
.item{display:flex;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--fur-d);margin-left:6px}
.tag.od{background:var(--badbg);color:var(--bad)}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.seg{display:flex;background:#e2e8d6;border-radius:18px;padding:4px;margin-bottom:14px}
.seg button{flex:1;background:none;color:var(--fur-d);padding:10px 0;font-size:13.5px;border-radius:14px}
.seg button.on{background:#fff;color:var(--pri-d);box-shadow:0 2px 6px -2px rgba(75,50,25,.3)}
.sub{font:600 14px var(--disp);color:var(--pri);margin-top:18px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{background:var(--soft);border-radius:16px;padding:10px 4px;font-size:12.5px;color:var(--mute)}.stat b{display:block;font:600 16px var(--disp);color:var(--ink)}
.dayh{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:12px;padding:7px 12px;margin:16px 0 2px;font-size:13px;color:var(--mute);font-weight:700}
.dayh:first-of-type{margin-top:0}.dayh b{color:var(--fur-d);font-family:var(--disp);font-weight:600}
.ent{display:flex;justify-content:space-between;gap:8px;padding:10px 2px;border-bottom:1px dashed var(--line)}
.ent:last-child{border-bottom:0}.ent-r{display:flex;align-items:center;gap:8px;white-space:nowrap}.ent-r b{font:600 16px var(--disp)}
.hello{margin:6px 4px 14px}
.hello small{display:block;font-size:13px;color:var(--mute);font-weight:700}
.hello h2{margin:1px 0 0;font:600 28px/1.15 var(--disp);color:var(--fur-d)}
.mascot{border-radius:26px;padding:14px 14px 0;margin-bottom:14px;display:flex;align-items:flex-end;gap:10px;background:var(--okbg);position:relative;overflow:hidden}
.mascot::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-26px;height:48px;background:rgba(47,125,79,.18);border-radius:50%}
.mascot.warn{background:var(--warnbg)}.mascot.warn::after{background:rgba(245,158,11,.22)}
.mascot.bad{background:var(--badbg)}.mascot.bad::after{background:rgba(180,56,31,.15)}
.mascot svg{flex:0 0 100px;width:100px;height:100px;animation:bob 3.2s ease-in-out infinite;position:relative;z-index:1;margin-bottom:-6px}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.mascot svg,.eye,#busy svg{animation:none}}
.bubble{position:relative;z-index:1;background:#fffdf8;border-radius:20px 20px 20px 6px;padding:11px 14px;flex:1;min-width:0;font-size:14px;margin-bottom:18px;box-shadow:0 6px 14px -8px rgba(75,50,25,.4)}
.bubble::before{content:none}
.bubble .nm{font:600 14px var(--disp);color:var(--pri);margin-bottom:2px}
.mascot.warn .bubble .nm{color:var(--warn)}.mascot.bad .bubble .nm{color:var(--bad)}
.bubble .n{font-size:12.5px;color:var(--mute);margin-top:5px}
.tile{background:var(--soft);border-radius:16px;padding:11px 12px}
.tile .sm{font-weight:700}.tile b{font:600 18px var(--disp)}
.tile .ic{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--fur)}
.tile.g .ic{background:#2f7be0}.tile.p .ic{background:var(--sun)}.tile.b .ic{background:#8a8f98}.tile.c .ic{background:var(--pri)}.tile.d .ic{background:#d97706}.tile.h .ic{background:#7c4dff}
#busy{position:fixed;inset:0;background:rgba(238,242,230,.82);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;z-index:20;font:600 17px var(--disp);color:var(--fur-d)}
#busy svg{width:96px;height:96px;animation:bob 1s ease-in-out infinite}
#topbar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--sun);z-index:30;opacity:0}
#topbar.on{opacity:1;animation:bar 1.4s ease-in-out infinite}
@keyframes bar{0%{width:0;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0;margin-left:100%}}
#toast.ok{background:var(--pri-d)}#toast.err{background:var(--bad)}
#toast{position:fixed;left:14px;right:14px;bottom:98px;max-width:532px;margin:0 auto;background:var(--ink);color:#fff;padding:13px 16px;border-radius:18px;display:none;z-index:9;text-align:center;font:600 16px var(--disp);box-shadow:0 12px 28px -10px rgba(0,0,0,.4)}
table{width:100%;border-collapse:collapse}th,td{padding:8px 4px;text-align:right;border-bottom:1px dashed var(--line)}th:first-child,td:first-child{text-align:left}th{font-size:12.5px;color:var(--mute);font-weight:700}tr:last-child td{border-bottom:0}
.it-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:0 0 auto}.it-r b{font:600 17px var(--disp)}.more{padding:7px 12px;letter-spacing:.1em}
.paybox{background:var(--soft);border-radius:14px;padding:10px 12px;margin-top:8px}.paybox .acts{margin-top:6px}
.tile[data-act=bd]{cursor:pointer}.bdbox{background:var(--soft);border-radius:16px;padding:12px 14px;margin:0 0 12px}.bdbox>b{font:600 15px var(--disp);color:var(--fur-d)}.bdbox .row{padding:5px 0;font-size:14px}
.row.sub2{padding:3px 0 3px 14px;font-size:13.5px;border-bottom:0}
main,.card,.bubble{overflow-wrap:anywhere;word-break:break-word}.item>div,.ent>div,.row>span{min-width:0}.big{overflow-wrap:anywhere}
.ent>div:first-child{flex:1;min-width:0}.ent>.ent-r{flex:0 0 auto;min-width:auto}
</style>
</head>
<body>
<header><div><b><span id="logo"></span>Kapi</b><small id="sync">...</small></div><button class="ghost sm" data-act="reload">↻ Refresh</button></header>

<nav id="nav">
<button data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Home</button>
<button data-tab="log"><svg viewBox="0 0 24 24"><path d="M7 3h10a1 1 0 0 1 1 1v17l-3-2-3 2-3-2-3 2V4a1 1 0 0 1 1-1z"/><path d="M9 8h6M9 12h6"/></svg>Transaksyon</button>

<script>
// ====== ISANG BESES LANG: i-paste dito ang Apps Script URL (nagtatapos sa /exec) ======
const API_URL='https://script.google.com/macros/s/AKfycbyqsMv_r7FbAmSJWvGhMFmHh177hiO2KS6onWPpFovH_HbmoizYhLB2bfHjetTDthIJfA/exec';
const API_PIN='';
const USER_NAME='Mark';   // pangalan na babatiin ni Kapi   // kung may PIN sa Code.gs, ilagay din dito
// =======================================================================================
//#LOGIC-START
const TYPES=['Supplier','Staff','Store','Personal'];
const pad=n=>String(n).padStart(2,'0');
function utc(s){const p=s.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2]);}
function addDays(s,n){return new Date(utc(s)+n*86400000).toISOString().slice(0,10);}
function diffDays(a,b){return Math.round((utc(b)-utc(a))/86400000);}
function addRepeat(s,r){
  if(r==='weekly')return addDays(s,7);
  if(r==='biweekly')return addDays(s,14);
  if(r==='monthly'){
    const p=s.split('-').map(Number);let y=p[0],m=p[1]+1;
    if(m>12){m=1;y++;}
    const last=new Date(Date.UTC(y,m,0)).getUTCDate();
    return y+'-'+pad(m)+'-'+pad(Math.min(p[2],last));
  }
  return null;
}
function r2(n){return Math.round((+n||0)*100)/100;}
function sum(a,f){return r2(a.reduce((t,x)=>t+(+f(x)||0),0));}
function calcWallets(st,log,pay,tr){
  tr=tr||[];
  const paid=pay.filter(p=>p.status==='Paid');
  const pw=w=>sum(paid.filter(p=>(['GCash','Personal','Barya','Drawer','Huling'].includes(p.wallet)?p.wallet:'Cash')===w),p=>p.amount);
  const tIn=w=>sum(tr.filter(x=>x.to===w),x=>x.amount),tOut=w=>sum(tr.filter(x=>x.from===w),x=>x.amount);
  const cash=(+st.opening_cash||0)+sum(log,l=>l.sales)-sum(log,l=>l.gsales)-sum(log,l=>l.cashout)
    -(sum(log,l=>l.stock)-sum(log,l=>l.gstock))-(sum(log,l=>l.opex)-sum(log,l=>l.gopex))-pw('Cash')+tIn('Cash')-tOut('Cash');
  const gcash=(+st.opening_gcash||0)+sum(log,l=>l.gsales)-sum(log,l=>l.cashin)+sum(log,l=>l.cashout)+sum(log,l=>l.cofee)-sum(log,l=>l.gstock)-sum(log,l=>l.gopex)-sum(log,l=>l.loadcost)-pw('GCash')+tIn('GCash')-tOut('GCash');
  const personal=(+st.opening_personal||0)+tIn('Personal')-tOut('Personal')-pw('Personal');
  const barya=(+st.opening_barya||0)+tIn('Barya')-tOut('Barya')-pw('Barya');
  const drawer=(+st.opening_drawer||0)+sum(log,l=>l.cashin)+sum(log,l=>l.fee)+sum(log,l=>l.loadsale)+tIn('Drawer')-tOut('Drawer')-pw('Drawer');
  const huling=(+st.opening_huling||0)+tIn('Huling')-tOut('Huling')-pw('Huling');
  const R={cash:r2(cash),gcash:r2(gcash),drawer:r2(drawer),huling:r2(huling),personal:r2(personal),barya:r2(barya)};
  return{cash:R.cash,gcash:R.gcash,drawer:R.drawer,huling:R.huling,personal:R.personal,barya:R.barya,total:r2(R.cash+R.gcash+R.drawer+R.huling+R.personal+R.barya)};
}
function breakdown(st,log,pay,tr,which){
  tr=tr||[];
  const paid=pay.filter(p=>p.status==='Paid');
  const pw=w=>sum(paid.filter(p=>(['GCash','Personal','Barya','Drawer','Huling'].includes(p.wallet)?p.wallet:'Cash')===w),p=>p.amount);
  const tIn=w=>sum(tr.filter(x=>x.to===w),x=>x.amount),tOut=w=>sum(tr.filter(x=>x.from===w),x=>x.amount);
  const S_=f=>sum(log,l=>l[f]);
  const L=which==='huling'?[
    ['Panimulang Huling Benta',+st.opening_huling||0],['Lipat papasok',tIn('Huling')],['Lipat palabas',-tOut('Huling')],['Bayarin na binayad dito',-pw('Huling')]
  ]:which==='drawer'?[
    ['Panimulang Drawer',+st.opening_drawer||0],['Cash-in (tinanggap ko)',S_('cashin')],['Fee ng cash-in',S_('fee')],['Cash na tinanggap sa load',S_('loadsale')],
    ['Bayarin na binayad sa Drawer',-pw('Drawer')],['Lipat papasok',tIn('Drawer')],['Lipat palabas',-tOut('Drawer')]
  ]:which==='gcash'?[
    ['Panimulang GCash',+st.opening_gcash||0],['Binayad ng customer via GCash',S_('gsales')],['Cash-out (pumasok sa GCash)',S_('cashout')],['Fee ng cash-out',S_('cofee')],
    ['Cash-in (na-send ko)',-S_('cashin')],['Stock na binayad via GCash',-S_('gstock')],['Gastos na binayad via GCash',-S_('gopex')],['Load (ibinawas sa GCash)',-S_('loadcost')],
    ['Bayarin na binayad via GCash',-pw('GCash')],['Lipat papasok',tIn('GCash')],['Lipat palabas',-tOut('GCash')]
  ]:[
    ['Panimulang Cash',+st.opening_cash||0],['Benta (POS)',S_('sales')],['Binayad via GCash (nasa GCash na)',-S_('gsales')],
    ['Cash-out (inabot ko)',-S_('cashout')],['Stock (cash)',-(S_('stock')-S_('gstock'))],['Gastos ng store (cash)',-(S_('opex')-S_('gopex'))],
    ['Bayarin na binayad sa Cash',-pw('Cash')],['Lipat papasok',tIn('Cash')],['Lipat palabas',-tOut('Cash')]
  ];
  return L.filter(x=>x[1]!==0||x[0].indexOf('Panimula')===0);
}
function calcCash(st,log,pay,tr){return calcWallets(st,log,pay,tr).total;}
function gKita(l){return(+l.fee||0)+(+l.cofee||0)+(+l.loadsale||0)-(+l.loadcost||0);}
function salesDays(log,today,N){
  const start=addDays(today,-(N-1));
  return new Set(log.filter(l=>l.date>=start&&l.date<=today&&(+l.sales||0)>0).map(l=>l.date)).size;
}
function avgNet(log,today,N){
  const start=addDays(today,-(N-1));
  const rec=log.filter(l=>l.date>=start&&l.date<=today);
  if(!rec.length||salesDays(log,today,N)<3)return 0; // kulang pa ang data: huwag mag-extrapolate
  const first=rec.reduce((m,l)=>l.date<m?l.date:m,rec[0].date);
  return sum(rec,l=>(+l.sales||0)+gKita(l)-(+l.stock||0)-(+l.opex||0))/(diffDays(first,today)+1);
}
function forecast(st,log,pay,today,H,tr){
  H=H||30;
  const w=calcWallets(st,log,pay,tr),cash0=w.total,daily=avgNet(log,today,14),end=addDays(today,H),buffer=+st.buffer||0;
  const events=[];
  pay.filter(p=>p.status!=='Paid').forEach(p=>{
    const mk=(due,rec)=>({day:Math.max(0,diffDays(today,due)),amount:rec?(+p.baseAmount||+p.amount):+p.amount,type:p.type,name:p.name,due,overdue:due<today});
    if(p.due<=end)events.push(mk(p.due));
    let due=p.repeat&&p.repeat!=='none'?addRepeat(p.due,p.repeat):null;
    while(due&&due<=end){if(due>=today)events.push(mk(due,true));due=addRepeat(due,p.repeat);}
  });
  events.sort((a,b)=>a.day-b.day||a.due.localeCompare(b.due));
  const series=[];let bal=cash0,min=Infinity,minDay=0,firstNeg=null;
  for(let d=0;d<=H;d++){
    if(d>0)bal+=daily;
    bal=r2(bal-sum(events.filter(e=>e.day===d),e=>e.amount));
    series.push({day:d,date:addDays(today,d),bal});
    if(bal<min){min=bal;minDay=d;}
    if(bal<0&&!firstNeg)firstNeg={day:d,date:addDays(today,d),bal};
  }
  const due={},proj={};
  [7,14,30].forEach(n=>{due[n]=sum(events.filter(e=>e.day<=n),e=>e.amount);proj[n]=series[Math.min(n,H)].bal;});
  return{lowData:salesDays(log,today,14)<3,cash0,cash:w.cash,gcash:w.gcash,drawer:w.drawer,huling:w.huling,personal:w.personal,barya:w.barya,daily,series,min,minDay,minDate:addDays(today,minDay),firstNeg,due,proj,
    safe:Math.max(0,Math.floor(min-buffer)),overdue:sum(events.filter(e=>e.overdue),e=>e.amount),events};
}
function monthSummary(st,log,pay,ym){
  const L=log.filter(l=>String(l.date).startsWith(ym));
  const paid=pay.filter(p=>p.status==='Paid'&&String(p.paidDate).startsWith(ym));
  const by=t=>sum(paid.filter(p=>p.type===t),p=>p.amount);
  const sales=sum(L,l=>+l.sales||0),fee=sum(L,gKita),stock=sum(L,l=>l.stock),opex=sum(L,l=>l.opex);
  const sup=by('Supplier'),staff=by('Staff'),store=by('Store'),pers=by('Personal');
  const storeOut=stock+opex+sup+staff+store,storeNet=sales+fee-storeOut;
  const feeIn=sum(L,l=>l.fee),feeOut=sum(L,l=>l.cofee),loadP=sum(L,l=>(+l.loadsale||0)-(+l.loadcost||0));
  return{sales,fee,feeIn,feeOut,loadP,stock,opex,sup,staff,store,pers,storeOut,storeNet,totalNet:storeNet-pers,
    estProfit:sales*((+st.margin_pct||0)/100)+fee-opex-staff-store};
}
//#LOGIC-END

const WL={Drawer:'Drawer ng GCash',Huling:'Huling Benta'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(m,kind){const t=$('#toast');t.textContent=m;t.className=kind||'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',kind==='err'?6000:3000);

const BUSYMSG={addLog:'Sine-save...',editLog:'Sine-save...',savePayable:'Sine-save...',saveSettings:'Sine-save...',addTransfer:'Inililipat...',pay:'Binabayaran...',delLog:'Binubura...',delPayable:'Binubura...',delTransfer:'Binubura...',getAll:'Kumokonekta...'};
let busyT=null;
function showBusy(on,msg){
  const b=$('#busy');b.style.display=on?'flex':'none';clearTimeout(busyT);
  if(msg)$('#busyMsg').textContent=msg;
  if(on)busyT=setTimeout(()=>{$('#busyMsg').textContent='Mabagal ang Google ngayon, sandali lang...';},7000);

async function api(body){
  if(!cfg.url)throw new Error('Ilagay muna ang Apps Script URL sa Settings');
  // may sariling ID ang bawat pag-save para ligtas i-retry (hindi madodoble sa server)
  const payload=JSON.stringify(Object.assign({pin:cfg.pin},body,body.action==='getAll'?{}:{rid:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}));
  let j=null;
  for(let t=0;t<2&&!j;t++){
    const ac=typeof AbortController!=='undefined'?new AbortController():null,tm=setTimeout(()=>ac&&ac.abort(),45000);
    try{
      const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:payload,signal:ac?ac.signal:undefined});
      j=await r.json();
    }catch(e){if(t===1){const er=new Error('Mahina ang net o mabagal ang Google.');er.net=true;throw er;}await new Promise(r=>setTimeout(r,900));}
    finally{clearTimeout(tm);}
  }
  if(!j.ok)throw new Error(j.error||'May error');
  S={settings:j.settings,log:j.log,pay:j.pay,transfers:j.transfers||[]};
  try{localStorage.setItem('pk_cache',JSON.stringify(S));}catch(_){}
  $('#sync').textContent='Synced '+new Date().toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'});
  return j;
}
async function run(body,okMsg){
  if(ui.busy)return false;
  ui.busy=true;showBusy(true,BUSYMSG[body.action]||'Sandali...');
  let rerender=true;
  try{await api(body);if(okMsg)toast(okMsg,'ok');return true;}
  catch(e){
    if(e.net&&body.action!=='getAll'){
      showBusy(true,'Chine-check kung na-save...');
      try{await api({action:'getAll'});toast('⚠️ Mahina ang net. Na-refresh ang data: tingnan kung nandoon na bago ulitin.','err');}
      catch(_){toast('⚠️ Walang makuhang sagot. Huwag munang ulitin, i-refresh mamaya at tingnan kung na-save.','err');}
    }else{
      toast('⚠️ '+e.message+' (hindi na-save)','err');
      if(/Bayad na ito|Hindi nahanap/.test(e.message)){try{await api({action:'getAll'});}catch(_){}} // lumang data sa screen: i-refresh
      else rerender=false; // kulang/maling input: huwag burahin ang tinype
    }
    return false;
  }
  finally{ui.busy=false;showBusy(false);if(rerender)render();}
}
async function reload(){
  if(!cfg.url){$('#sync').textContent='Walang URL pa';render();return;}
  $('#sync').textContent='Naglo-load...';$('#topbar').classList.add('on');
  try{await api({action:'getAll'});}catch(e){$('#sync').textContent='Offline (lumang data)';toast('⚠️ '+e.message,'err');}
  $('#topbar').classList.remove('on');
  render();
}

function spark(series){
  const W=320,H=70,v=series.map(s=>s.bal);
  let mn=Math.min(0,...v),mx=Math.max(0,...v);if(mx===mn)mx=mn+1;
  const y=n=>H-3-(n-mn)/(mx-mn)*(H-6),x=i=>i/(series.length-1)*W;
  const pts=series.map((s,i)=>x(i).toFixed(1)+','+y(s.bal).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="70"><line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#b4381f" stroke-dasharray="4 3" stroke-width="1"/><polygon points="0,${H} ${pts} ${W},${H}" fill="#2f7d4f" opacity=".12"/><polyline points="${pts}" fill="none" stroke="#2f7d4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function dayLabel(d){
  const t=todayStr();
  if(d===t)return 'Ngayon';
  if(d===addDays(t,-1))return 'Kahapon';
  return new Date(utc(d)).toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'});
}
function entryInfo(l,T){
  const L=[],m=(c,v,x)=>{if(+v)L.push(c+' '+peso(v)+(x||''));};
  if(T==='benta')return{has:+l.sales>0,amt:+l.sales||0,lines:[]};
  if(T==='gastos'){
    m('📦 Stock',l.stock,+l.gstock?' (GCash '+peso(l.gstock)+')':'');
    m('🧾 Gastos',l.opex,+l.gopex?' (GCash '+peso(l.gopex)+')':'');
    return{has:L.length>0,amt:(+l.stock||0)+(+l.opex||0),lines:L};
  }
  m('💳 GCash payment',l.gsales);
  m('⬆️ Cash-in',l.cashin,+l.fee?' · fee '+peso(l.fee):'');if(+l.fee&&!+l.cashin)L.push('💰 Fee '+peso(l.fee));
  m('⬇️ Cash-out (inabot)',l.cashout,+l.cofee?' · fee '+peso(l.cofee):'');if(+l.cofee&&!+l.cashout)L.push('💰 Fee '+peso(l.cofee));
  if(+l.loadsale||+l.loadcost)L.push('📲 Load '+peso(l.loadsale)+' · kita '+peso((+l.loadsale||0)-(+l.loadcost||0)));
  return{has:L.length>0,amt:gKita(l),lines:L};
}

  const html=groups.map(g=>`<div class="dayh"><span>${dayLabel(g.d)}</span><b>${T==='gcash'?'Kita ':''}${peso(g.tot)}</b></div>`
    +g.items.map(r=>`<div class="ent"><div><b>${esc(r.l.notes)||title}</b>${r.i.lines.map(x=>`<div class="sm mute">${x}</div>`).join('')}</div><div class="ent-r">${r.i.amt?`<b>${peso(r.i.amt)}</b>`:''}<button class="ghost sm" data-act="editlog" data-id="${esc(r.l.id)}" aria-label="Edit">✏️</button><button class="danger sm" data-act="dellog" data-id="${esc(r.l.id)}">✕</button></div></div>`).join('')).join('');
  return `<div class="card"><h3>Huling ${title.toLowerCase()} entries</h3>${html||'<div class="mute">Wala pa.</div>'}</div>`;
}
function editLogCard(){
  const l=S.log.find(x=>x.id===ui.editLog);if(!l)return '';
  const n=(k,lab)=>`<label>${lab}</label><input type="number" name="${k}" inputmode="decimal" min="0" step="any" value="${+l[k]||''}" placeholder="0">`;
  return `<div class="card"><h3>I-edit ang entry</h3><form id="fEditLog"><label>Petsa</label><input type="date" name="date" value="${esc(l.date)}" required>
${n('sales','Total na benta (POS)')}${n('gsales','Binayad via GCash (kasama sa benta)')}
<div class="sub">GCash</div>${n('cashin','Cash-in: halaga na na-send ko')}${n('fee','Cash-in fee')}${n('cashout','Cash-out: cash na inabot ko')}${n('cofee','Cash-out fee')}${n('loadsale','Load: cash na tinanggap')}${n('loadcost','Load: ibinawas sa GCash')}
<div class="sub">Gastos ng store</div>${n('stock','Stock (bayad agad)')}${n('gstock','Doon, binayad via GCash')}${n('opex','Ibang gastos ng store')}${n('gopex','Doon, binayad via GCash')}
<label>Note</label><input name="notes" maxlength="200" value="${esc(l.notes)}">
<div class="grid2"><button class="full">I-save</button><button type="button" class="ghost full" data-act="canceleditlog">Kansel</button></div></form></div>`;
}
function renderLog(){
  if(ui.editLog&&S.log.some(x=>x.id===ui.editLog))return editLogCard();
  const t=todayStr(),T=ui.logType,td=S.log.filter(l=>l.date===t);
  const seg=[['benta','🛒 Benta'],['gcash','📱 GCash'],['gastos','🧾 Gastos'],['lipat','🔁 Lipat']].map(x=>`<button type="button" class="${T===x[0]?'on':''}" data-act="logtype" data-v="${x[0]}">${x[1]}</button>`).join('');
  const today=`<div class="card"><h3>Ngayong araw</h3><div class="stat"><div><span class="sm mute">Benta</span><b>${peso(sum(td,l=>+l.sales||0))}</b></div><div><span class="sm mute">Gastos</span><b>${peso(sum(td,l=>(+l.stock)+(+l.opex)))}</b></div><div><span class="sm mute">Kita GCash</span><b>${peso(sum(td,gKita))}</b></div></div></div>`;
  const pers=T==='gastos'?`<div class="card"><h3>Personal na gastos</h3><div class="sm mute">Pagkain, pamasahe at iba pang sa iyo, hindi sa negosyo. Hindi ito kasama sa tantyang tubo ng store.</div>
<form id="fPers"><label>Ano ito? (optional)</label><input name="name" maxlength="80" placeholder="hal. Pamasahe, Pagkain">
<label>Halaga</label><input type="number" name="amount" inputmode="decimal" min="0" step="any" required>
<label>Kinuha sa</label><select name="wallet"><option>Cash</option><option>GCash</option><option>Personal</option></select>
<button class="full">Save personal</button></form></div>`:'';
  let body;
  if(T==='lipat'){
    body=`<div class="card"><form id="fTr"><div class="grid2"><div><label>Mula sa</label><select name="from"><option value="Cash">Cash</option><option value="GCash">GCash</option><option value="Drawer">Drawer ng GCash</option><option value="Huling">Huling Benta</option><option value="Personal">Personal</option><option value="Barya">Barya</option></select></div><div><label>Papunta sa</label><select name="to"><option value="Huling">Huling Benta</option><option value="Cash">Cash</option><option value="GCash">GCash</option><option value="Drawer">Drawer ng GCash</option><option value="Personal">Personal</option><option value="Barya">Barya</option></select></div></div>
<label>Halaga</label><input type="number" name="amount" inputmode="decimal" min="0" step="any" required>
<button class="full">Ilipat</button></form><div class="sm mute" style="margin-top:8px">Hindi nito binabago ang kabuuang pera, nagpapalit lang ng wallet.</div></div>
<div class="card"><h3>Huling paglipat</h3>${S.transfers.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).map(x=>`<div class="item"><div class="sm">${dlabel(x.date)} · ${esc(WL[x.from]||x.from)} → ${esc(WL[x.to]||x.to)} · <b>${peso(x.amount)}</b></div><button class="danger sm" data-act="deltr" data-id="${esc(x.id)}">✕</button></div>`).join('')||'<div class="mute">Wala pa.</div>'}</div>`;
  }else{
    body=`<div class="card"><form id="fLog"><label>Petsa</label><input type="date" name="date" value="${t}" required>${logFields(T)}
<label>Note (optional)</label><input name="notes" maxlength="200">
<button class="full">Save</button></form></div>
${pers}
${entriesCard(T)}`;
  }
  return `<div class="seg">${seg}</div>${T==='lipat'?'':today}${body}`;
}

function renderBills(){
  const t=todayStr(),F=ui.filter;
  const open=S.pay.filter(p=>p.status!=='Paid'&&(F==='all'||p.type===F)).sort((a,b)=>a.due.localeCompare(b.due));
  const paid=S.pay.filter(p=>p.status==='Paid').sort((a,b)=>String(b.paidDate).localeCompare(String(a.paidDate))).slice(0,10);
  const e=ui.edit?S.pay.find(p=>p.id===ui.edit&&p.status!=='Paid'):null;
  const v=e||{type:'Supplier',name:'',amount:'',due:addDays(t,7),repeat:'none',notes:''};
  const opt=(a,sel)=>a.map(x=>`<option ${x[0]===sel?'selected':''} value="${x[0]}">${x[1]}</option>`).join('');
  const form=ui.form?`<div class="card"><h3>${e?'I-edit':'Bagong'} bayarin</h3><form id="fBill">
<label>Uri</label><select name="type">${opt([['Supplier','Supplier (utang sa paninda)'],['Staff','Sweldo ng tauhan'],['Store','Gastos ng store (renta, kuryente)'],['Personal','Personal (car loan, Meralco, Shopee)']],v.type)}</select>
<label>Pangalan</label><input name="name" value="${esc(v.name)}" required maxlength="80" placeholder="hal. Coca-Cola, Car loan">
<label>Halaga</label><input type="number" name="amount" inputmode="decimal" min="0" step="any" value="${esc(v.amount)}" required>
${e?'':`<div class="grid2"><div><label>Petsa ng resibo</label><input type="date" name="receipt" value="${t}"></div><div><label>Terms</label><select name="terms">${opt([['0','Manual'],['7','7 araw'],['14','14 araw'],['30','30 araw']],'7')}</select></div></div>`}
<label>Due date</label><input type="date" name="due" value="${esc(v.due)}" required>
${e?'':`<label>Bayad na ba ngayon?</label><select name="paynow">${opt([['','Hindi pa, i-lista lang'],['Cash','Oo, bayad na ngayon sa Cash'],['GCash','Oo, bayad na ngayon sa GCash'],['Personal','Oo, bayad na ngayon sa Personal']],'')}</select>`}
<label>Umuulit?</label><select name="repeat">${opt([['none','Hindi'],['weekly','Kada linggo'],['biweekly','Kada 2 linggo'],['monthly','Kada buwan']],v.repeat||'none')}</select>
<label>Note</label><input name="notes" maxlength="200" value="${esc(v.notes)}">
<div class="grid2"><button class="full">Save</button><button type="button" class="ghost full" data-act="cancel">Kansel</button></div></form></div>`:'';
  const chips=[['all','Lahat'],...TYPES.map(x=>[x,x])].map(c=>`<button class="chip ${F===c[0]?'on':''}" data-act="filter" data-v="${c[0]}">${c[1]}</button>`).join('');
  const item=p=>{
    const d=diffDays(t,p.due),od=d<0,id=esc(p.id);
    const panel=ui.pay===p.id?`<div class="paybox"><label style="margin-top:0">Magkano ang babayaran? <span class="mute sm">· bawasan kung hulog lang</span></label><input type="number" class="payamt" inputmode="decimal" min="0" step="any" max="${+p.amount}" value="${+p.amount}"><div class="sm mute" style="margin:8px 0 2px">Saan huhugutin?</div><div class="acts"><button class="sm" data-act="pay" data-w="Cash" data-id="${id}">Cash</button><button class="sm" data-act="pay" data-w="GCash" data-id="${id}">GCash</button><button class="sm" data-act="pay" data-w="Personal" data-id="${id}">Personal</button><button class="ghost sm" data-act="closepay">Kansel</button></div></div>`
      :ui.more===p.id?`<div class="acts"><button class="ghost sm" data-act="edit" data-id="${id}">Edit</button><button class="danger sm" data-act="delbill" data-id="${id}">Burahin</button><button class="ghost sm" data-act="closepay">Isara</button></div>`:'';
    return `<div class="item"><div style="flex:1;min-width:0"><b>${esc(p.name)}</b>${F==='all'&&p.type!=='Personal'?'<span class="tag">'+esc(p.type)+'</span>':''}${p.repeat&&p.repeat!=='none'?'<span class="tag">↻ '+esc(p.repeat)+'</span>':''}
<div class="sm ${od?'neg':'mute'}">${od?'LAMPAS '+(-d)+' araw · ':d===0?'Due ngayon · ':'Due '+d+' araw · '}${dlabel(p.due)}</div>${panel}</div>
<div class="it-r"><b>${peso(p.amount)}</b>${panel?'':`<div class="acts" style="margin:0"><button class="sm" data-act="askpay" data-id="${id}">Bayad</button><button class="ghost sm more" data-act="more" data-id="${id}" aria-label="Iba pa">⋯</button></div>`}</div></div>`;};
  const sec=(title,arr)=>`<div class="card"><h3>${title} (${arr.length}) · ${peso(sum(arr,p=>p.amount))}</h3>${arr.map(item).join('')}</div>`;
  let lists;
  if(!open.length)lists='<div class="card"><div class="mute">Walang bayarin 🎉</div></div>';
  else if(F==='all'){
    const st=open.filter(p=>p.type!=='Personal'),pe=open.filter(p=>p.type==='Personal');
    lists=(st.length?sec('Para sa store',st):'')+(pe.length?sec('Personal',pe):'');
  }else lists=sec(F==='Personal'?'Personal':F,open);
  return `${form}<div class="card"><button class="full" style="margin:0" data-act="newbill">+ Dagdag na bayarin</button></div>
<div class="chips">${chips}</div>${lists}
<div class="card"><h3>Nabayaran na (huli)</h3>${paid.map(p=>`<div class="row"><span>${esc(p.name)} <span class="sm mute">${dlabel(p.paidDate)}</span></span><span>${peso(p.amount)}</span></div>`).join('')||'<div class="mute">Wala pa.</div>'}</div>`;
}

function renderSet(){
  const s=S.settings;
  const conn=API_URL?'':`<div class="card"><h3>Koneksyon</h3><div class="sm mute">Tip: i-paste ang URL sa taas ng index.html (API_URL) para hindi na ito hinihingi.</div><form id="fCfg">
<label>Apps Script Web App URL</label><input name="url" value="${esc(cfg.url)}" placeholder="https://script.google.com/macros/s/.../exec">
<label>PIN (kung nilagay mo sa Code.gs)</label><input name="pin" value="${esc(cfg.pin)}" type="password" autocomplete="off">
<button class="full">I-save at i-test</button></form></div>`;
  const F=[['opening_cash','Panimulang Cash','Cash na hawak mo nung nagsimula ka mag-log'],['opening_gcash','Panimulang GCash','Balance ng GCash wallet nung nagsimula ka'],['opening_drawer','Panimulang Drawer ng GCash','Cash sa drawer ng cash-in at load'],['opening_huling','Panimulang Huling Benta','Perang iniwan mo sa store bilang huling benta'],['opening_personal','Panimulang Personal','Pera na pang-sarili mo'],['opening_barya','Panimulang Barya','Coins ng store, hiwalay sa Pondo'],['margin_pct','Margin ng tubo (%)','Tantya ng tubo sa benta'],['buffer','Buffer','Pinakamababang pera na gusto mong laging may natitira']];
  if(!ui.setEdit)return conn+`<div class="card"><h3>Pera</h3>${F.map(f=>`<div class="row"><span>${f[1]}<div class="sm mute">${f[2]}</div></span><b>${f[0]==='margin_pct'?(+s[f[0]]||0)+'%':peso(+s[f[0]]||0)}</b></div>`).join('')}
<button class="ghost full" data-act="setedit">✏️ Baguhin</button></div>`;
  return conn+`<div class="card"><h3>Baguhin ang Settings</h3><div class="banner warn">Baguhin lang ito kung sigurado ka. Apektado ang lahat ng balance at forecast.</div><form id="fSet">
${F.map(f=>`<label>${f[1]} <span class="mute sm">· ${f[2]}</span></label><input type="number" name="${f[0]}" inputmode="decimal" step="any" value="${+s[f[0]]||0}">`).join('')}
<div class="grid2"><button class="full">I-save</button><button type="button" class="ghost full" data-act="setcancel">Kansel</button></div></form></div>`;
}

function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));
  const y=window.scrollY;
  $('#app').innerHTML=ui.tab==='home'?renderHome():ui.tab==='log'?renderLog():ui.tab==='bills'?renderBills():renderSet();
  window.scrollTo(0,y);
}

document.addEventListener('click',async ev=>{
  const tb=ev.target.closest('[data-tab]');
  if(tb){ui.tab=tb.dataset.tab;ui.form=false;ui.edit=null;ui.pay=null;ui.more=null;ui.setEdit=false;ui.editLog=null;render();window.scrollTo(0,0);return;}
  const el=ev.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='reload')return reload();
  if(a==='logtype'){ui.logType=el.dataset.v;return render();}
  if(a==='filter'){ui.filter=el.dataset.v;return render();}
  if(a==='drawer2cash'){
    const f=forecast(S.settings,S.log,S.pay,todayStr(),30,S.transfers);
    ui.tab='log';ui.logType='lipat';ui.bd=null;render();window.scrollTo(0,0);
    const fm=$('#fTr');if(fm){fm.elements.from.value='Drawer';fm.elements.to.value='Cash';fm.elements.amount.value=f.drawer;}
    return;}
  if(a==='bd'){ui.bd=ui.bd===el.dataset.v?null:el.dataset.v;return render();}
  if(a==='askpay'){ui.pay=id;ui.more=null;ui.form=false;ui.edit=null;return render();}
  if(a==='more'){ui.more=id;ui.pay=null;ui.form=false;ui.edit=null;return render();}
  if(a==='closepay'){ui.pay=null;ui.more=null;return render();}
  if(a==='setedit'){ui.setEdit=true;render();window.scrollTo(0,0);return;}
  if(a==='setcancel'){ui.setEdit=false;return render();}
  if(a==='newbill'){ui.form=true;ui.edit=null;render();window.scrollTo(0,0);return;}
  if(a==='cancel'){ui.form=false;ui.edit=null;return render();}
  if(a==='edit'){ui.form=true;ui.edit=id;render();window.scrollTo(0,0);return;}
  if(a==='pay'){const w=el.dataset.w||'Cash';const inp=el.closest('.paybox')&&el.closest('.paybox').querySelector('.payamt'),p0=S.pay.find(x=>x.id===id),amt=inp?+inp.value:0;
    if(inp&&!(amt>0)){toast('⚠️ Ilagay ang halaga','err');return;}
    const part=p0&&amt>0&&amt<+p0.amount;
    if(await run({action:'pay',id,date:todayStr(),wallet:w,amount:part?amt:undefined},part?'Hulog na-record ✓':'Nabayaran na ✓')){ui.pay=null;ui.more=null;render();}return;}
  if(a==='deltr'){if(confirm('Burahin ang paglipat?'))await run({action:'delTransfer',id},'Binura');return;}
  if(a==='delbill'){if(confirm('Burahin ang bayarin na ito?'))await run({action:'delPayable',id},'Binura');return;}
  if(a==='editlog'){ui.editLog=id;render();window.scrollTo(0,0);return;}
  if(a==='canceleditlog'){ui.editLog=null;return render();}
  if(a==='dellog'){if(confirm('Burahin ang entry?'))await run({action:'delLog',id},'Binura');return;}
});

document.addEventListener('input',ev=>{
  const f=ev.target.form;
  if(!f||f.id!=='fBill'||!f.elements.terms)return;
  if(ev.target.name==='receipt'||ev.target.name==='terms'){
    const n=+f.elements.terms.value;
    if(n&&f.elements.receipt.value)f.elements.due.value=addDays(f.elements.receipt.value,n);
  }
});

document.addEventListener('submit',async ev=>{
  ev.preventDefault();
  const f=ev.target,d=Object.fromEntries(new FormData(f));
  if(f.id==='fLog'){
    if(+d.cashout&&d.feemode!=='extra'){const h=(+d.cashout)-(+d.cofee||0);if(h<0){toast('⚠️ Mas malaki ang fee kesa sa cash-out','err');return;}d.cashout=String(Math.round(h*100)/100);}
    if(await run({action:'addLog',date:d.date,sales:d.sales,stock:d.stock,opex:d.opex,cashin:d.cashin,cashout:d.cashout,fee:d.fee,cofee:d.cofee,gsales:d.gsales,loadsale:d.loadsale,loadcost:d.loadcost,gstock:d.gstock,gopex:d.gopex,notes:d.notes},'Na-save ✓'))render();
  }else if(f.id==='fEditLog'){
    const ok=await run({action:'editLog',id:ui.editLog,date:d.date,sales:d.sales,stock:d.stock,opex:d.opex,cashin:d.cashin,cashout:d.cashout,fee:d.fee,cofee:d.cofee,gsales:d.gsales,loadsale:d.loadsale,loadcost:d.loadcost,gstock:d.gstock,gopex:d.gopex,notes:d.notes},'Na-update ✓');
    if(ok){ui.editLog=null;render();}
  }else if(f.id==='fPers'){
    const before=new Set(S.pay.map(p=>p.id));
    if(!(await run({action:'savePayable',type:'Personal',name:(d.name||'').trim()||'Personal na gastos',amount:d.amount,due:todayStr(),repeat:'none',notes:'Mabilis na gastos'})))return;
    const np=S.pay.find(p=>!before.has(p.id));
    if(np)await run({action:'pay',id:np.id,date:todayStr(),wallet:d.wallet},'Na-save ✓');
  }else if(f.id==='fTr'){
    await run({action:'addTransfer',date:todayStr(),from:d.from,to:d.to,amount:d.amount},'Nailipat ✓');
  }else if(f.id==='fBill'){
    const before=new Set(S.pay.map(p=>p.id));
    const ok=await run({action:'savePayable',id:ui.edit||undefined,type:d.type,name:d.name,amount:d.amount,due:d.due,repeat:d.repeat,notes:d.notes},d.paynow?undefined:'Na-save ✓');
    if(!ok)return;
    ui.form=false;ui.edit=null;
    if(d.paynow){const np=S.pay.find(p=>!before.has(p.id));if(np)await run({action:'pay',id:np.id,date:todayStr(),wallet:d.paynow},'Nabayaran na ✓');}
    render();
  }else if(f.id==='fSet'){
    const keys=['opening_cash','opening_gcash','opening_drawer','opening_huling','opening_personal','opening_barya','margin_pct','buffer'],lab={opening_cash:'Cash',opening_gcash:'GCash',opening_drawer:'Drawer',opening_huling:'Huling Benta',opening_personal:'Personal',opening_barya:'Barya',margin_pct:'Margin %',buffer:'Buffer'};
    const ch=keys.filter(k=>(+d[k]||0)!==(+S.settings[k]||0));
    if(!ch.length){ui.setEdit=false;return render();}
    if(!confirm('I-save ang pagbabago?\n\n'+ch.map(k=>lab[k]+': '+(+S.settings[k]||0)+' → '+(+d[k]||0)).join('\n')))return;
    if(await run({action:'saveSettings',settings:Object.fromEntries(ch.map(k=>[k,d[k]]))},'Na-save ✓')){ui.setEdit=false;render();}
  }else if(f.id==='fCfg'){
    cfg={url:d.url.trim(),pin:d.pin.trim()};
    localStorage.setItem('pk_cfg',JSON.stringify(cfg));
    if(await run({action:'getAll'},'Konektado ✓'))ui.tab='home',render();
  }
});

$('#logo').innerHTML=mascotSVG('ok');$('#busyK').innerHTML=mascotSVG('ok');
if(!cfg.url)ui.tab='set';
render();
if(cfg.url)reload();
</script>
</body>
</html>
