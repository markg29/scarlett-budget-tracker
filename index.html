<style>

.tile.g .ic{background:#2f7be0}.tile.p .ic{background:var(--sun)}.tile.b .ic{background:#8a8f98}.tile.c .ic{background:var(--pri)}.tile.d .ic{background:#d97706}.tile.h .ic{background:#7c4dff}.tile.u .ic{background:#0e9aa7}
#busy{position:fixed;inset:0;background:rgba(238,242,230,.82);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;z-index:20;font:600 17px var(--disp);color:var(--fur-d)}

table{width:100%;border-collapse:collapse}th,td{padding:8px 4px;text-align:right;border-bottom:1px dashed var(--line)}th:first-child,td:first-child{text-align:left}th{font-size:12.5px;color:var(--mute);font-weight:700}tr:last-child td{border-bottom:0}
.it-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:0 0 auto}.it-r b{font:600 17px var(--disp)}.more{padding:7px 12px;letter-spacing:.1em}
.paybox{background:var(--soft);border-radius:14px;padding:10px 12px;margin-top:8px}.paybox .acts{margin-top:6px}
.tile[data-act=bd]{cursor:pointer}.bdbox{background:var(--soft);border-radius:16px;padding:12px 14px;margin:0 0 12px}.bdbox>b{font:600 15px var(--disp);color:var(--fur-d)}.bdbox .row{padding:5px 0;font-size:14px}
.row.sub2{padding:3px 0 3px 14px;font-size:13.5px;border-bottom:0}
main,.card,.bubble{overflow-wrap:anywhere;word-break:break-word}.item>div,.ent>div,.row>span{min-width:0}.big{overflow-wrap:anywhere}
.ent>div:first-child{flex:1;min-width:0}.ent>.ent-r{flex:0 0 auto;min-width:auto}
</style>

<script>
// ====== ISANG BESES LANG: i-paste dito ang Apps Script URL (nagtatapos sa /exec) ======
const API_URL='https://script.google.com/macros/s/AKfycbyqsMv_r7FbAmSJWvGhMFmHh177hiO2KS6onWPpFovH_HbmoizYhLB2bfHjetTDthIJfA/exec';
const API_PIN='';
const NEED_VER=14;const BUILD='nov13-budget-visit';   // pinakabagong bersyon ng Code.gs na kailangan ng app na ito
const USER_NAME='Mark';   // pangalan na babatiin ni Kapi   // kung may PIN sa Code.gs, ilagay din dito
// =======================================================================================
//#LOGIC-START
const TYPES=['Supplier','Staff','Store','Personal'];
const pad=n=>String(n).padStart(2,'0');
function utc(s){const p=s.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2]);}
function addDays(s,n){return new Date(utc(s)+n*86400000).toISOString().slice(0,10);}
function diffDays(a,b){return Math.round((utc(b)-utc(a))/86400000);}
function addRepeat(s,r){
  if(r==='weekly')return addDays(s,7);
  if(r==='biweekly')return addDays(s,14);
  if(r==='monthly'){
    const p=s.split('-').map(Number);let y=p[0],m=p[1]+1;
    if(m>12){m=1;y++;}
    const last=new Date(Date.UTC(y,m,0)).getUTCDate();
    return y+'-'+pad(m)+'-'+pad(Math.min(p[2],last));
  }
  return null;
}
function r2(n){return Math.round((+n||0)*100)/100;}
function sum(a,f){return r2(a.reduce((t,x)=>t+(+f(x)||0),0));}
let CW=[];
function setCW(a){CW=(Array.isArray(a)?a:[]).filter(w=>w&&String(w.id).indexOf('w_')===0);}
function knownW(){return['GCash','Personal','Barya','Drawer','Huling'].concat(CW.map(w=>w.id));}
function calcWallets(st,log,pay,tr){
  tr=tr||[];
  const paid=pay.filter(p=>p.status==='Paid');
  const pw=w=>sum(paid.filter(p=>(knownW().includes(p.wallet)?p.wallet:'Cash')===w),p=>p.amount);
  const tIn=w=>sum(tr.filter(x=>x.to===w),x=>x.amount),tOut=w=>sum(tr.filter(x=>x.from===w),x=>x.amount);
  const cash=(+st.opening_cash||0)+sum(log,l=>l.sales)-sum(log,l=>l.gsales)-sum(log,l=>l.cashout)
    -(sum(log,l=>l.stock)-sum(log,l=>l.gstock))-(sum(log,l=>l.opex)-sum(log,l=>l.gopex))-pw('Cash')+tIn('Cash')-tOut('Cash');
  const gcash=(+st.opening_gcash||0)+sum(log,l=>l.gsales)-sum(log,l=>l.cashin)+sum(log,l=>l.cashout)+sum(log,l=>l.cofee)-sum(log,l=>l.gstock)-sum(log,l=>l.gopex)-sum(log,l=>l.loadcost)-pw('GCash')+tIn('GCash')-tOut('GCash');
  const personal=(+st.opening_personal||0)+tIn('Personal')-tOut('Personal')-pw('Personal');
  const barya=(+st.opening_barya||0)+tIn('Barya')-tOut('Barya')-pw('Barya');
  const drawer=(+st.opening_drawer||0)+sum(log,l=>l.cashin)+sum(log,l=>l.fee)+sum(log,l=>l.loadsale)+tIn('Drawer')-tOut('Drawer')-pw('Drawer');
  const huling=(+st.opening_huling||0)+tIn('Huling')-tOut('Huling')-pw('Huling');
  const utang=(+st.opening_utang||0)+tIn('Utang')-tOut('Utang');
  const R={cash:r2(cash),gcash:r2(gcash),drawer:r2(drawer),huling:r2(huling),personal:r2(personal),barya:r2(barya)};
  const cust={};let ctot=0;CW.forEach(w=>{const b=r2((+w.opening||0)+tIn(w.id)-tOut(w.id)-pw(w.id));cust[w.id]=b;if(String(w.inTotal)!=='0')ctot+=b;});
  return{cash:R.cash,gcash:R.gcash,drawer:R.drawer,huling:R.huling,personal:R.personal,barya:R.barya,utang:r2(utang),cust,total:r2(R.cash+R.gcash+R.drawer+R.huling+R.personal+R.barya+ctot)};
}
function breakdown(st,log,pay,tr,which){
  tr=tr||[];
  const cw=CW.find(w=>w.id===which),WK=cw?which:{cash:'Cash',gcash:'GCash',drawer:'Drawer',huling:'Huling',utang:'Utang'}[which],trAll=tr;
  tr=tr.filter(x=>x.from!=='Adjust'&&x.to!=='Adjust');
  const paid=pay.filter(p=>p.status==='Paid');
  const pw=w=>sum(paid.filter(p=>(knownW().includes(p.wallet)?p.wallet:'Cash')===w),p=>p.amount);
  const tIn=w=>sum(tr.filter(x=>x.to===w),x=>x.amount),tOut=w=>sum(tr.filter(x=>x.from===w),x=>x.amount);
  const S_=f=>sum(log,l=>l[f]);
  const L=cw?[
    ['Panimulang '+cw.name,+cw.opening||0],['Lipat papasok',tIn(which)],['Lipat palabas',-tOut(which)],['Bayarin na binayad dito',-pw(which)]
  ]:which==='utang'?[
    ['Panimulang utang ng iba',+st.opening_utang||0],['Pinautang (lipat papasok)',tIn('Utang')],['Nasingil / nabayaran (lipat palabas)',-tOut('Utang')]
  ]:which==='huling'?[
    ['Panimulang Huling Benta',+st.opening_huling||0],['Lipat papasok',tIn('Huling')],['Lipat palabas',-tOut('Huling')],['Bayarin na binayad dito',-pw('Huling')]
  ]:which==='drawer'?[
    ['Panimulang Pera ng GCash',+st.opening_drawer||0],['Cash-in (tinanggap ko)',S_('cashin')],['Fee ng cash-in',S_('fee')],['Cash na tinanggap sa load',S_('loadsale')],
    ['Bayarin na binayad dito',-pw('Drawer')],['Lipat papasok',tIn('Drawer')],['Lipat palabas',-tOut('Drawer')]
  ]:which==='gcash'?[
    ['Panimulang GCash',+st.opening_gcash||0],['Binayad ng customer via GCash',S_('gsales')],['Cash-out (pumasok sa GCash)',S_('cashout')],['Fee ng cash-out',S_('cofee')],
    ['Cash-in (na-send ko)',-S_('cashin')],['Stock na binayad via GCash',-S_('gstock')],['Gastos na binayad via GCash',-S_('gopex')],['Load (ibinawas sa GCash)',-S_('loadcost')],
    ['Bayarin na binayad via GCash',-pw('GCash')],['Lipat papasok',tIn('GCash')],['Lipat palabas',-tOut('GCash')]
  ]:[
    ['Panimulang Cash',+st.opening_cash||0],['Benta (POS)',S_('sales')],['Binayad via GCash (nasa GCash na)',-S_('gsales')],
    ['Cash-out (inabot ko)',-S_('cashout')],['Stock (cash)',-(S_('stock')-S_('gstock'))],['Gastos ng store (cash)',-(S_('opex')-S_('gopex'))],
    ['Bayarin na binayad sa Cash',-pw('Cash')],['Lipat papasok',tIn('Cash')],['Lipat palabas',-tOut('Cash')]
  ];
  const adj=sum(trAll.filter(x=>x.from==='Adjust'&&x.to===WK),x=>x.amount)-sum(trAll.filter(x=>x.to==='Adjust'&&x.from===WK),x=>x.amount);
  L.push(['Ayos (dagdag/bawas)',adj]);
  return L.filter(x=>x[1]!==0||x[0].indexOf('Panimula')===0);
}
function calcCash(st,log,pay,tr){return calcWallets(st,log,pay,tr).total;}
function gKita(l){return(+l.fee||0)+(+l.cofee||0)+(+l.loadsale||0)-(+l.loadcost||0);}
function salesDays(log,today,N){
  const start=addDays(today,-(N-1));
  return new Set(log.filter(l=>l.date>=start&&l.date<=today&&(+l.sales||0)>0).map(l=>l.date)).size;
}
function avgNet(log,today,N){
  const start=addDays(today,-(N-1));
  const rec=log.filter(l=>l.date>=start&&l.date<=today);
  if(!rec.length||salesDays(log,today,N)<3)return 0; // kulang pa ang data: huwag mag-extrapolate
  const first=rec.reduce((m,l)=>l.date<m?l.date:m,rec[0].date);
  return sum(rec,l=>(+l.sales||0)+gKita(l)-(+l.stock||0)-(+l.opex||0))/(diffDays(first,today)+1);
}
function stockStats(log,today){
  const start=addDays(today,-27),L=log.filter(l=>l.date>=start&&l.date<=today&&(+l.stock||0)>0);
  const byDay={};L.forEach(l=>{byDay[l.date]=(byDay[l.date]||0)+(+l.stock||0);});
  const v=Object.values(byDay);
  return{week:r2(sum(L,l=>+l.stock||0)/4),max:v.length?Math.max.apply(null,v):0,days:v.length};
}
function forecast(st,log,pay,today,H,tr){
  H=H||30;
  const w=calcWallets(st,log,pay,tr),cash0=w.total,daily=avgNet(log,today,14),end=addDays(today,H),buffer=+st.buffer||0;
  const events=[];
  pay.filter(p=>p.status!=='Paid').forEach(p=>{
    const mk=(due,rec)=>({day:Math.max(0,diffDays(today,due)),amount:rec?(+p.baseAmount||+p.amount):+p.amount,type:p.type,name:p.name,due,overdue:due<today});
    if(p.due<=end)events.push(mk(p.due));
    let due=p.repeat&&p.repeat!=='none'?addRepeat(p.due,p.repeat):null;
    while(due&&due<=end){if(due>=today)events.push(mk(due,true));due=addRepeat(due,p.repeat);}
  });
  events.sort((a,b)=>a.day-b.day||a.due.localeCompare(b.due));
  const series=[];let bal=cash0,min=Infinity,minDay=0,firstNeg=null;
  for(let d=0;d<=H;d++){
    if(d>0)bal+=daily;
    bal=r2(bal-sum(events.filter(e=>e.day===d),e=>e.amount));
    series.push({day:d,date:addDays(today,d),bal});
    if(bal<min){min=bal;minDay=d;}
    if(bal<0&&!firstNeg)firstNeg={day:d,date:addDays(today,d),bal};
  }
  // safe weekly: pinakamahigpit na linggo-linggong gastos para hindi bumaba sa buffer sa susunod na 28 araw (70% lang ng positibong avg kita ang isinama)
  const dc=daily>0?daily*0.7:daily;let b2=cash0-sum(events.filter(e=>e.day===0),e=>e.amount),Wk=Infinity;
  for(let d=1;d<=Math.min(H,28);d++){b2+=dc-sum(events.filter(e=>e.day===d),e=>e.amount);Wk=Math.min(Wk,(b2-buffer)/(d/7));}
  const weekly=Math.max(0,Math.floor((isFinite(Wk)?Wk:0)/100)*100);
  const due={},proj={};
  [7,14,30].forEach(n=>{due[n]=sum(events.filter(e=>e.day<=n),e=>e.amount);proj[n]=series[Math.min(n,H)].bal;});
  return{lowData:salesDays(log,today,14)<3,cash0,cash:w.cash,gcash:w.gcash,drawer:w.drawer,huling:w.huling,utang:w.utang,personal:w.personal,barya:w.barya,daily,weekly,series,min,minDay,minDate:addDays(today,minDay),firstNeg,due,proj,
    safe:Math.max(0,Math.floor(min-buffer)),overdue:sum(events.filter(e=>e.overdue),e=>e.amount),events};
}
function monthSummary(st,log,pay,ym){
  const L=log.filter(l=>String(l.date).startsWith(ym));
  const paid=pay.filter(p=>p.status==='Paid'&&String(p.paidDate).startsWith(ym));
  const by=t=>sum(paid.filter(p=>p.type===t),p=>p.amount);
  const sales=sum(L,l=>+l.sales||0),fee=sum(L,gKita),stock=sum(L,l=>l.stock),opex=sum(L,l=>l.opex);
  const sup=by('Supplier'),staff=by('Staff'),store=by('Store'),pers=by('Personal');
  const storeOut=stock+opex+sup+staff+store,storeNet=sales+fee-storeOut;
  const feeIn=sum(L,l=>l.fee),feeOut=sum(L,l=>l.cofee),loadP=sum(L,l=>(+l.loadsale||0)-(+l.loadcost||0));
  return{sales,fee,feeIn,feeOut,loadP,stock,opex,sup,staff,store,pers,storeOut,storeNet,totalNet:storeNet-pers,
    estProfit:sales*((+st.margin_pct||0)/100)+fee-opex-staff-store};
}


function supKey(n){return String(n||'').toLowerCase().replace(/[^a-z0-9ñ ]/g,' ').replace(/\s+/g,' ').trim();}
function supNames(log,pay){const m={};pay.filter(p=>p.type==='Supplier').forEach(p=>{const k=supKey(p.name);if(k&&!m[k])m[k]=String(p.name).trim();});log.forEach(l=>{const k=supKey(l.supplier);if(k&&!m[k])m[k]=String(l.supplier).trim();});return Object.keys(m).map(k=>m[k]);}
function supCheck(name,known){const k=supKey(name);if(!k)return{name:'',near:null};for(const n of known||[])if(supKey(n)===k)return{name:n,near:null,exact:true};let best=null;(known||[]).forEach(n=>{const d=chatLev(k,supKey(n));if(d<=2&&k.length>=4&&(!best||d<best.d))best={n,d};});return{name:String(name).replace(/\s+/g,' ').trim(),near:best?best.n:null};}
function supVisits(log,pay,hist,today){
  hist=Array.isArray(hist)?hist:[];
  const hMax=hist.reduce((m,x)=>String(x.date)>m?String(x.date):m,''),logCut=log.filter(l=>(+l.stock||0)>0&&l.supplier).reduce((m,l)=>l.date<m?l.date:m,'9999-12-31'),from=addDays(today,-150);
  const D={};const add=(n,d)=>{const k=supKey(n);d=String(d);if(!k||d<from||d>today)return;(D[k]=D[k]||{});D[k][d]=1;};
  hist.filter(x=>String(x.date)<logCut).forEach(x=>add(x.supplier,x.date));
  log.filter(l=>(+l.stock||0)>0&&l.supplier).forEach(l=>add(l.supplier,l.date));
  pay.filter(p=>p.status==='Paid'&&p.type==='Supplier'&&(!hMax||String(p.paidDate)>hMax)).forEach(p=>add(p.name,p.paidDate));
  const y=+today.slice(0,4),m=+today.slice(5,7),mEnd=today.slice(0,8)+String(new Date(Date.UTC(y,m,0)).getUTCDate()).padStart(2,'0');
  const out={};
  Object.keys(D).forEach(k=>{
    const ds=Object.keys(D[k]).sort();if(ds.length<3)return;
    const iv=[];for(let i=1;i<ds.length;i++)iv.push(diffDays(ds[i-1],ds[i]));iv.sort((a,b)=>a-b);
    const every=Math.max(1,Math.round(iv[Math.floor((iv.length-1)/2)]));
    const last=ds[ds.length-1],next=addDays(last,every),late=next<today?diffDays(next,today):0,eff=late?today:next;
    let left=0,d=eff;while(d<=mEnd&&left<40){left++;d=addDays(d,every);}
    out[k]={every,last,next:eff,late,left,n:ds.length};
  });
  return out;
}
function stockBudget(st,log,pay,today,hist){
  hist=Array.isArray(hist)?hist:[];
  const hMax=hist.reduce((m,x)=>String(x.date)>m?String(x.date):m,''),logCut=log.filter(l=>(+l.stock||0)>0&&l.supplier).reduce((m,l)=>l.date<m?l.date:m,'9999-12-31');
  const m=(+st.margin_pct||0)/100,s30=addDays(today,-29),s90=addDays(today,-89);
  const rows=from=>{const by={};const add=(name,amt)=>{const k=supKey(name);const e=by[k]||(by[k]={name:'',amt:0});if(name&&!e.name)e.name=String(name).trim();e.amt+=amt;};
    hist.filter(x=>String(x.date)<logCut&&String(x.date)>=from&&String(x.date)<=today).forEach(x=>add(x.supplier,+x.amount||0));
    log.filter(l=>l.date>=from&&l.date<=today&&(+l.stock||0)>0&&(!hMax||l.date>hMax||l.supplier)).forEach(l=>add(l.supplier||'',+l.stock||0));
    pay.filter(p=>p.status==='Paid'&&p.type==='Supplier'&&String(p.paidDate)>=from&&String(p.paidDate)<=today&&(!hMax||String(p.paidDate)>hMax)).forEach(p=>add(p.name,+p.amount||0));
    return by;};
  const b30=rows(s30),b90=rows(s90),V=o=>Object.keys(o).map(k=>o[k]);
  const sales30=sum(log.filter(l=>l.date>=s30&&l.date<=today),l=>+l.sales||0),budget=Math.round(sales30*(1-m));

  const dueEnd=addDays(today,14),dueBy={};
  pay.filter(p=>p.status!=='Paid'&&p.type==='Supplier'&&String(p.due)<=dueEnd).forEach(p=>{const k=supKey(p.name);const e=dueBy[k]||(dueBy[k]={name:String(p.name).trim(),amt:0,n:0});e.amt+=+p.amount||0;e.n++;});
  const keys={};Object.keys(b30).concat(Object.keys(b90),Object.keys(dueBy)).forEach(k=>{keys[k]=1;});
  const list=Object.keys(keys).map(k=>{const sh=tot90?(b90[k]?b90[k].amt:0)/tot90:0;return{key:k,name:(b30[k]&&b30[k].name)||(b90[k]&&b90[k].name)||'',spent:r2(b30[k]?b30[k].amt:0),share:sh,limit:Math.round(budget*sh),due:r2(dueBy[k]?dueBy[k].amt:0)};}).map(x=>Object.assign(x,{name:x.name||(dueBy[x.key]&&dueBy[x.key].name)||'',avail:r2(x.limit-x.spent-x.due)})).sort((a,b)=>b.share-a.share||b.spent-a.spent||b.due-a.due);

  const others=pay.filter(p=>p.status!=='Paid'&&p.type!=='Supplier'&&String(p.due)<=dueEnd),dueOther=r2(sum(others,p=>+p.amount||0)),otherBy={};
  others.forEach(p=>{otherBy[p.type]=r2((otherBy[p.type]||0)+(+p.amount||0));});
  const d30=addDays(today,30),dueAll30=r2(sum(pay.filter(p=>p.status!=='Paid'&&String(p.due)<=d30),p=>+p.amount||0));
  const vis=supVisits(log,pay,hist,today);list.forEach(x=>{x.visit=vis[x.key]||null;});
  return{sales30,budget,spent,left:r2(budget-spent),due,dueOther,otherBy,dueAll:r2(due+dueOther),dueAll30,avail:r2(budget-spent-due),list};
}

function chatNum(t){const n=parseFloat(String(t).replace(/,/g,''));return/k\s*$/i.test(String(t))?Math.round(n*1000*100)/100:n;}
const pf=n=>'₱'+(Math.round(n*100)/100).toLocaleString('en-PH');
function chatLev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];}for(let j=0;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length];}
const CHAT_KW=['benta','stock','cashin','cashout','load','gastos','gas'];
function parseChat(text,today,known){
  const T=String(text||'').replace(/(\d),(?=\d{3}(?!\d))/g,'$1').replace(/₱|php|piso/gi,' ');
  const entries=[],errors=[],unknown=[];let dflt=today;
  const NUM=/(\d+(?:\.\d+)?)\s*(k\b)?/gi;
  T.split(/[\n;]+|,\s*|\s\+\s/).forEach(raw=>{
    const part=raw.trim();if(!part)return;
    const lower=part.toLowerCase();
    const day=/\bkahapon\b/.test(lower)?addDays(today,-1):null;
    const nums=[...lower.matchAll(NUM)].map(m=>chatNum(m[1]+(m[2]?'k':'')));
    const words=lower.replace(NUM,' ').replace(/\b(kahapon|ngayon)\b/g,' ').replace(/\s+/g,' ').trim();
    if(!nums.length&&!words){if(day)dflt=day;return;}
    if(!nums.length&&/^(kahapon|ngayon)$/.test(words)){if(day)dflt=day;return;}
    if(!nums.length){errors.push('"'+part+'": walang halaga.');return;}
    const date=day||dflt;
    const fm=lower.match(/\b(?:fee|charge|kita)\s*[:=]?\s*(\d+(?:\.\d+)?)\s*(k\b)?/);
    const fee=fm?chatNum(fm[1]+(fm[2]?'k':'')):0;
    const a=nums[0],viaG=/\bg-?cash\b/.test(words);
    const rest=words.replace(/\b(fee|charge|kita|g-?cash)\b/g,' ').replace(/\s+/g,' ').trim();
    const F={},add=(k,v)=>{F[k]=Math.round(((+F[k]||0)+v)*100)/100;};let item=null,note='';
    const tok=rest.split(' ').filter(Boolean);
    const KW=[/\b(benta|sales?)\b/,/\bstock\b/,/\bcash[\s-]?in\b/,/\bcash[\s-]?out\b/,/\bload\b/,/\b(gastos|gas|expenses?|opex|exp)\b/].filter(re=>re.test(rest)).length;
    if(KW>1){errors.push('"'+part+'": dalawang uri ang nasa isang linya. Isang entry kada linya.');return;}
    const has=re=>re.test(rest);
    const strip=re=>rest.replace(re,' ').replace(/\s+/g,' ').trim();
    if(has(/\b(benta|sales?)\b/)){add('sales',a);note=strip(/\b(benta|sales?)\b/);item={t:'Benta',d:note,amt:a};}
    else if(has(/\bstock\b/)){add('stock',a);if(viaG)add('gstock',a);
      const supRaw=part.replace(/(\d+(?:\.\d+)?)\s*(k\b)?/gi,' ').replace(/\b(stock|kahapon|ngayon|fee|charge|kita)\b/gi,' ').replace(/\bg-?cash\b/gi,' ').replace(/\s+/g,' ').trim();
      const sc=supCheck(supRaw,known);
      if(sc.near){errors.push('"'+part+'": ibig mo bang sabihin "'+sc.near+'"? Gamitin ang eksaktong pangalan.');return;}
      if(sc.name&&!sc.exact){errors.push('"'+part+'": wala sa listahan ang supplier na "'+sc.name+'".');unknown.push(sc.name);return;}
      if(sc.name)F.supplier=sc.name;note='';item={t:'Stock'+(viaG?' (GCash)':''),d:sc.name?'supplier: '+sc.name:'',amt:a};}
    else if(has(/\bcash[\s-]?in\b/)){add('cashin',a);if(fee)add('fee',fee);note=strip(/\bcash[\s-]?in\b/);item={t:'Cash-in',d:fee?'fee '+pf(fee):'',amt:a};}
    else if(has(/\bcash[\s-]?out\b/)){if(fee>=a){errors.push('"'+part+'": mas malaki ang fee kesa sa cash-out.');return;}add('cashout',a-fee);if(fee)add('cofee',fee);note=strip(/\bcash[\s-]?out\b/);item={t:'Cash-out',d:fee?'fee '+pf(fee)+' · aabutin '+pf(a-fee):'',amt:a};}
    else if(has(/\bload\b/)){const c=nums[1]!==undefined?nums[1]:a;add('loadsale',a);add('loadcost',c);note=strip(/\bload\b/);item={t:'Load',d:'kita '+pf(a-c),amt:a};}
    else if(has(/\b(gastos|gas|expenses?|opex|exp)\b/)){add('opex',a);if(viaG)add('gopex',a);note=strip(/\b(gastos|gas|expenses?|opex|exp)\b/)||(tok.includes('gas')?'gas':'gastos');item={t:'Ibang gastos'+(viaG?' (GCash)':''),d:note,amt:a};}
    else{
      let best=null;tok.forEach(w=>CHAT_KW.forEach(k=>{const dd=chatLev(w,k);if(dd<=2&&w.length>=3&&(!best||dd<best.d))best={w,k,d:dd};}));
      errors.push('"'+part+'": hindi ko kilala ang '+(best?'"'+best.w+'". Ibig mo bang sabihin "'+best.k+'"?':'"'+(tok[0]||part)+'". Gamitin ang: benta, stock, cashin, cashout, load, o gastos.'));return;
    }
    entries.push({date,fields:F,notes:note,item});
  });
  const fields={};entries.forEach(e=>Object.keys(e.fields).forEach(k=>{fields[k]=Math.round(((+fields[k]||0)+e.fields[k])*100)/100;}));
  return{entries,unknown:unknown.filter((n,i,a)=>a.findIndex(m=>supKey(m)===supKey(n))===i),items:entries.map(e=>Object.assign({date:e.date},e.item)),errors,fields,notes:entries.map(e=>e.notes).filter(Boolean).join(', '),date:entries[0]?entries[0].date:today};
}

function visTxt(v){

async function api(body){
  if(!cfg.url)throw new Error('Ilagay muna ang Apps Script URL sa Settings');
  // may sariling ID ang bawat pag-save para ligtas i-retry (hindi madodoble sa server)
  const payload=JSON.stringify(Object.assign({pin:cfg.pin},body,body.action==='getAll'?{}:{rid:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}));
  let j=null;
  for(let t=0;t<2&&!j;t++){
    const ac=typeof AbortController!=='undefined'?new AbortController():null,tm=setTimeout(()=>ac&&ac.abort(),45000);
    try{
      const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:payload,signal:ac?ac.signal:undefined});
      j=await r.json();
    }catch(e){if(t===1){const er=new Error('Mahina ang net o mabagal ang Google.');er.net=true;throw er;}await new Promise(r=>setTimeout(r,900));}
    finally{clearTimeout(tm);}
  }
  if(!j.ok)throw new Error(j.error||'May error');
  srvVer=+j.ver||1;
  const nx=normS(j),had=S.log.length+S.pay.length+S.transfers.length,has=nx.log.length+nx.pay.length+nx.transfers.length;
  if(body.action==='getAll'&&had>0&&has===0){ui.emptyWarn=true;$('#sync').textContent='⚠️ Walang laman ang Sheet';return j;} // huwag burahin ang kopya sa phone
  ui.emptyWarn=false;S=nx;setCW(S.wallets);
  try{localStorage.setItem('pk_cache',JSON.stringify(S));}catch(_){}
  $('#sync').textContent='Synced '+new Date().toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'});
  return j;
}
async function run(body,okMsg){
  if(ui.busy)return false;
  ui.busy=true;showBusy(true,BUSYMSG[body.action]||'Sandali...');
  let rerender=true;
  try{await api(body);if(okMsg)toast(okMsg,'ok');return true;}
  catch(e){
    if(e.net&&body.action!=='getAll'){
      showBusy(true,'Chine-check kung na-save...');
      try{await api({action:'getAll'});toast('⚠️ Mahina ang net. Na-refresh ang data: tingnan kung nandoon na bago ulitin.','err');}
      catch(_){toast('⚠️ Walang makuhang sagot. Huwag munang ulitin, i-refresh mamaya at tingnan kung na-save.','err');}
    }else{
      toast('⚠️ '+e.message+' (hindi na-save)','err');
      if(/Bayad na ito|Hindi nahanap/.test(e.message)){try{await api({action:'getAll'});}catch(_){}} // lumang data sa screen: i-refresh
      else rerender=false; // kulang/maling input: huwag burahin ang tinype
    }

  }
  finally{ui.busy=false;showBusy(false);if(rerender)render();}
}

}

function dayLabel(d){
  const t=todayStr();
  if(d===t)return 'Ngayon';
  if(d===addDays(t,-1))return 'Kahapon';
  return new Date(utc(d)).toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'});
}
function entryInfo(l,T){
  const L=[],m=(c,v,x)=>{if(+v)L.push(c+' '+peso(v)+(x||''));};
  if(T==='benta')return{has:+l.sales>0,amt:+l.sales||0,lines:[]};
  if(T==='gastos'){
    m('📦 Stock'+(l.supplier?' · '+esc(l.supplier):''),l.stock,+l.gstock?' (GCash '+peso(l.gstock)+')':'');
    m('🧾 Gastos',l.opex,+l.gopex?' (GCash '+peso(l.gopex)+')':'');
    return{has:L.length>0,amt:(+l.stock||0)+(+l.opex||0),stock:+l.stock||0,opex:+l.opex||0,lines:L};
  }
  m('💳 GCash payment',l.gsales);
  m('⬆️ Cash-in',l.cashin,+l.fee?' · fee '+peso(l.fee):'');if(+l.fee&&!+l.cashin)L.push('💰 Fee '+peso(l.fee));
  m('⬇️ Cash-out (inabot)',l.cashout,+l.cofee?' · fee '+peso(l.cofee):'');if(+l.cofee&&!+l.cashout)L.push('💰 Fee '+peso(l.cofee));
  if(+l.loadsale||+l.loadcost)L.push('📲 Load '+peso(l.loadsale)+' · kita '+peso((+l.loadsale||0)-(+l.loadcost||0)));
  return{has:L.length>0,amt:gKita(l),lines:L};
}
function entriesCard(T){

  return `<div class="card"><h3>Huling ${title.toLowerCase()} entries</h3>${html||'<div class="mute">Wala pa.</div>'}${more}${tot<=N?less:''}</div>`;

      const s2=nf.elements[e.name];if(s2){if(![...s2.options].some(o=>o.value===use)){const o=document.createElement('option');o.value=o.textContent=use;s2.insertBefore(o,s2.options[s2.options.length-1]);}s2.value=use;}
      if(fid==='fBill')billType(nf);}
  }
});
document.addEventListener('input',ev=>{
  if(ev.target.form&&ev.target.form.id==='fAdj')updAdj();
  const f=ev.target.form;
  if(!f||f.id!=='fBill'||!f.elements.terms)return;
  if(ev.target.name==='receipt'||ev.target.name==='terms'){
    const n=+f.elements.terms.value;
    if(n&&f.elements.receipt.value)f.elements.due.value=addDays(f.elements.receipt.value,n);
  }
});

document.addEventListener('input',ev=>{const e=ev.target;if(e&&e.id==='chatmsg'){e.style.height='auto';e.style.height=Math.min(e.scrollHeight,160)+'px';}});
document.addEventListener('submit',async ev=>{
  ev.preventDefault();
  const f=ev.target,d=Object.fromEntries(new FormData(f));
  if(d.supplier==='__new')d.supplier='';if(d.supname==='__new')d.supname='';
  if(f.id==='fBill'&&d.type==='Supplier'&&d.supname!==undefined)d.name=d.supname;
  if(f.id==='fChat'){
    ui.chatText=d.msg;const r=parseChat(d.msg,todayStr(),supKnown());
    ui.chat=(r.items.length||r.errors.length)?r:{err:'Wala akong nakitang halaga. Hal: <b>gas 500</b> o <b>stock 12000</b>.'};
    render();return;
  }else if(f.id==='fLog'){
    {const sc=supCheck(d.supplier,supKnown());d.supplier=(+d.stock>0)?sc.name:'';if(d.supplier&&sc.near&&confirm('Ibig mo bang sabihin "'+sc.near+'"?\n\nOK = gamitin ang "'+sc.near+'"\nCancel = gamitin ang "'+sc.name+'" (bagong supplier)'))d.supplier=sc.near;}
    if(+d.cashout&&d.feemode!=='extra'){const h=(+d.cashout)-(+d.cofee||0);if(h<0){toast('⚠️ Mas malaki ang fee kesa sa cash-out','err');return;}d.cashout=String(Math.round(h*100)/100);}
    if(await run({action:'addLog',date:d.date,sales:d.sales,stock:d.stock,opex:d.opex,cashin:d.cashin,cashout:d.cashout,fee:d.fee,cofee:d.cofee,gsales:d.gsales,loadsale:d.loadsale,loadcost:d.loadcost,gstock:d.gstock,gopex:d.gopex,supplier:d.supplier,notes:d.notes},'Na-save ✓'))render();
  }else if(f.id==='fEditLog'){
    {const sc=supCheck(d.supplier,supKnown());d.supplier=(+d.stock>0)?sc.name:'';if(d.supplier&&sc.near&&confirm('Ibig mo bang sabihin "'+sc.near+'"?\n\nOK = gamitin ang "'+sc.near+'"\nCancel = gamitin ang "'+sc.name+'" (bagong supplier)'))d.supplier=sc.near;}
    const ok=await run({action:'editLog',id:ui.editLog,date:d.date,sales:d.sales,stock:d.stock,opex:d.opex,cashin:d.cashin,cashout:d.cashout,fee:d.fee,cofee:d.cofee,gsales:d.gsales,loadsale:d.loadsale,loadcost:d.loadcost,gstock:d.gstock,gopex:d.gopex,supplier:d.supplier,notes:d.notes},'Na-update ✓');
    if(ok){ui.editLog=null;render();}
  }else if(f.id==='fPers'){
    const before=new Set(S.pay.map(p=>p.id));
    if(!(await run({action:'savePayable',type:'Personal',name:(d.name||'').trim()||'Personal na gastos',amount:d.amount,due:todayStr(),repeat:'none',notes:'Mabilis na gastos'})))return;
    const np=S.pay.find(p=>!before.has(p.id));
    if(np)await run({action:'pay',id:np.id,date:todayStr(),wallet:d.wallet},'Na-save ✓');
  }else if(f.id==='fAdj'){
    const r=adjDelta(d.wallet,d.mode,d.amount);
    if(!r.delta){toast('Walang pagbabago: pareho na ang balanse','ok');return;}
    const amt=Math.abs(r.delta);
    if(!confirm('I-save ang ayos?\n\n'+wname(d.wallet)+': '+peso(r.cur)+' → '+peso(r.cur+r.delta)+'\n(Hindi ito gastos o tubo)'))return;
    const ok=await run(r.delta>0?{action:'addTransfer',date:todayStr(),from:'Adjust',to:d.wallet,amount:amt,notes:d.notes}:{action:'addTransfer',date:todayStr(),from:d.wallet,to:'Adjust',amount:amt,notes:d.notes},'Na-ayos ✓');
    if(ok)render();
  }else if(f.id==='fTr'){
    await run({action:'addTransfer',date:todayStr(),from:d.from,to:d.to,amount:d.amount},'Nailipat ✓');
  }else if(f.id==='fBill'){
    if(d.type==='Supplier'){const sc=supCheck(d.name,supKnown());d.name=sc.name||d.name;if(sc.near&&confirm('Ibig mo bang sabihin "'+sc.near+'"?\n\nOK = gamitin ang "'+sc.near+'"\nCancel = gamitin ang "'+sc.name+'" (bagong supplier)'))d.name=sc.near;}
    const before=new Set(S.pay.map(p=>p.id));
    const ok=await run({action:'savePayable',id:ui.edit||undefined,type:d.type,name:d.name,amount:d.amount,due:d.due,repeat:d.repeat,notes:d.notes},d.paynow?undefined:'Na-save ✓');
    if(!ok)return;
    ui.form=false;ui.edit=null;
    if(d.paynow){const np=S.pay.find(p=>!before.has(p.id));if(np)await run({action:'pay',id:np.id,date:todayStr(),wallet:d.paynow},'Nabayaran na ✓');}
    render();
  }else if(f.id==='fPaid'){
    if(await run({action:'editPaid',id:d.pid,type:d.type,name:d.name,amount:d.amount,paidDate:d.paidDate,wallet:d.wallet,notes:d.notes},'Na-save ✓')){ui.paidEdit=null;render();}
  }else if(f.id==='fSet'){
    const keys=['opening_cash','opening_gcash','opening_drawer','opening_huling','opening_utang','opening_personal','opening_barya','margin_pct','buffer'],lab={opening_cash:'Cash',opening_gcash:'GCash',opening_drawer:'Pera ng GCash',opening_huling:'Huling Benta',opening_utang:'Utang ng iba',opening_personal:'Personal',opening_barya:'Barya',margin_pct:'Margin %',buffer:'Buffer'};
    const ch=keys.filter(k=>(+d[k]||0)!==(+S.settings[k]||0));
    if(!ch.length){ui.setEdit=false;return render();}
    if(!confirm('I-save ang pagbabago?\n\n'+ch.map(k=>lab[k]+': '+(+S.settings[k]||0)+' → '+(+d[k]||0)).join('\n')))return;
    if(await run({action:'saveSettings',settings:Object.fromEntries(ch.map(k=>[k,d[k]]))},'Na-save ✓')){ui.setEdit=false;render();}
  }else if(f.id==='fWal'){
    const body={action:'saveWallet',id:d.wid||undefined,name:d.name};
    if(!d.wid||String(d.wid).indexOf('w_')===0){body.opening=d.opening;body.inTotal=d.intotal?'1':'0';}
    if(await run(body,'Na-save ✓')){ui.walEdit=null;render();}
  }else if(f.id==='fSup'){
    if(await run({action:'saveSupplier',name:d.name},'Naidagdag ✓'))render();
  }else if(f.id==='fCfg'){
    cfg={url:d.url.trim(),pin:d.pin.trim()};
    localStorage.setItem('pk_cfg',JSON.stringify(cfg));
    if(await run({action:'getAll'},'Konektado ✓'))ui.tab='home',render();
  }
});

$('#logo').innerHTML=mascotSVG('ok');$('#busyK').innerHTML=mascotSVG('ok');
if(!cfg.url)ui.tab='set';
render();
if(cfg.url)reload();
</script>
